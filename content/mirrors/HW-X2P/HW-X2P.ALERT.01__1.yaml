verification_notes: ["Alert numbers and MENU / SELECT / DISMISS per settings-matrix.md HW-X2P.ALERT.01. 405/407 are P1; 170/171/173 are P2 and appear only in our instructions.", "2026-10-10 Tree Lead blind second check: FAIL (mirror-second-check.md #22). Fixed against the primary source, not the matrix: Select / Dismiss in screen case and set as on-screen labels; path step ALRT; Exit key added. The invented line \"Alerts clear on their own\" is removed; p.16 says an alert can’t be dismissed. Held until Tree Lead re-checks it.", "2026-10-10 Tree Lead re-check: PASS. verified_on reset to the check date (shown in the LC-4 caption). Un-held in v3.1."]
our_instruction_text:
  - "An alert symbol on the screen means there’s an alert."
  - "Press MENU, use the arrows to reach ALRT, then press Select to see the alert number. Press Exit to go back."
  - "405 or 407: the batteries are low or very low. Put in fresh AA alkaline batteries."
  - "171: set the time and date. 170 or 173: the thermostat itself has a fault, so call a pro."
  - "An alert can’t be dismissed. Fix the cause, for example by putting in fresh batteries. Dismiss is only for reminders."
